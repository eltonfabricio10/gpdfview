[package]
name = "gpdfview"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.10"
glib = "0.19"
gio = "0.19"
poppler-rs = "0.26"
once_cell = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "gpdfview"
path = "src/main.rs"

[[bin]]
name = "test_poppler"
path = "src/bin/test_poppler.rs"
