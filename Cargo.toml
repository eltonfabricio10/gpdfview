[package]
name = "gpdfview"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native GTK PDF viewer for Linux"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["gtk_v4_10"] }
cairo = { package = "cairo-rs", version = "0.22.0", features = ["pdf"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }
poppler = { package = "poppler-rs", version = "0.26.0", features = ["v26_1"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
