[package]
name = "gpdfview"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_10", "v4_12"] }
libadwaita = "0.9"
glib = "0.20"
gio = "0.20"
cairo = { package = "cairo-rs", version = "0.22", features = ["pdf"] }
poppler-rs = "0.26"
once_cell = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "gpdfview"
path = "src/main.rs"

[[bin]]
name = "test_poppler"
path = "src/bin/test_poppler.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1






